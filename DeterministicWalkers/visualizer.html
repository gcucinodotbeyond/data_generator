<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --user-msg-bg: #3b82f6;
            --assistant-msg-bg: #334155;
            --tool-msg-bg: #475569;
            --border-color: #334155;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .upload-section {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .upload-btn {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background-color: var(--accent-color);
            color: white;
        }

        .drop-zone {
            padding: 1.5rem;
            border: 2px dashed var(--border-color);
            border-radius: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .drop-zone:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .drop-zone.active {
            border-color: var(--accent-color);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .file-group {
            margin-bottom: 1rem;
        }

        .file-header {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background-color: rgba(0, 0, 0, 0.2);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .conversation-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s;
            border: 1px solid transparent;
        }

        .conversation-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .conversation-item.active {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: var(--accent-color);
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.25rem;
        }

        .item-scenario {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-id {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* User Message */
        .user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 0.2rem;
        }

        /* Assistant Message */
        .assistant {
            align-self: flex-start;
            background-color: var(--assistant-msg-bg);
            border-bottom-left-radius: 0.2rem;
        }

        /* System Message */
        .system {
            align-self: stretch;
            /* Full width for system prompt */
            background-color: #1e1e1e;
            border: 1px solid #d97706;
            /* Amber border */
            max-width: 95%;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 1rem;
            font-family: 'Fira Code', monospace;
        }

        .system .message-header {
            color: #fbbf24;
            /* Amber text */
            border-bottom: 1px solid rgba(251, 191, 36, 0.2);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        /* Tool Message */
        .tool {
            align-self: flex-start;
            background-color: var(--tool-msg-bg);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            border-left: 4px solid #10b981;
        }

        /* Function Call */
        .function-call {
            background-color: #2e1065;
            border: 1px solid #8b5cf6;
            margin-top: 0.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        /* Metadata Panel */
        .metadata-panel {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-left: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .meta-section {
            margin-bottom: 2rem;
        }

        /* View Toolbar */
        .view-toolbar {
            display: flex;
            background-color: var(--sidebar-bg);
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            gap: 0.5rem;
        }

        .view-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .view-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .view-btn.active {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        #rawContainer {
            flex: 1;
            padding: 2rem;
            overflow: auto;
            display: none;
        }

        .raw-pre {
            background-color: #1e1e1e;
            padding: 1.5rem;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #d1d5db;
            margin: 0;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .meta-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .json-block {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            color: #d1d5db;
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            flex-direction: column;
            gap: 1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Context Box within message */
        .context-box {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #d1d5db;
        }

        .context-box-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .context-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <!-- Sidebar for Files/Conversations -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1 class="title">Dataset Visualizer</h1>
        </div>

        <div class="upload-section">
            <select id="datasetSelector" class="upload-btn"
                style="width: 100%; appearance: none; -webkit-appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%233b82f6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22/%3E%3C/svg%3E'); background-repeat: no-repeat; background-position: right .7rem top 50%; background-size: .65rem auto; padding-right: 2rem;">
                <option value="">Loading datasets...</option>
            </select>
            <div id="refreshBtn" class="upload-btn"
                style="margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <span>🔄</span> Refresh List
            </div>
            <div id="dropZone" class="drop-zone" style="margin-top: 0.5rem;">
                or drop local files here
            </div>
            <input type="file" id="fileInput" accept=".jsonl,.json" style="display: none;" multiple>
        </div>

        <div id="conversationList" class="conversation-list">
            <!-- List items will be injected here -->
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="main-content">
        <div class="view-toolbar">
            <button class="view-btn active" onclick="switchView('current')">🏠 current</button>
            <button class="view-btn" onclick="switchView('last_user')">🧪 context in last user</button>
            <button class="view-btn" onclick="switchView('all_user')">🧪 context in all user</button>
            <button class="view-btn" onclick="switchView('tool_to_user')">🛠️ tool -> user</button>
        </div>
        <div id="chatContainer" class="chat-container">
            <div class="empty-state">
                <div style="font-size: 3rem;">👋</div>
                <h2>Select a conversation to view</h2>
                <p>Load the <code>DeterministicWalkers/data</code> folder to start</p>
                <p style="font-size: 0.8rem; color: #64748b;">(Or if visualizer_data.js is present, data is preloaded)
                </p>
            </div>
        </div>
    </div>

    <!-- Right Metadata Panel -->
    <div class="metadata-panel" id="metadataPanel" style="display: none;">
        <div class="meta-section">
            <div class="meta-title">Metadata</div>
            <div id="metaContent" class="json-block"></div>
        </div>
        <div class="meta-section">
            <div class="meta-title">Contexts</div>
            <div id="contextContent" class="json-block"></div>
        </div>
    </div>

    <script>
        const datasetSelector = document.getElementById('datasetSelector');
        const refreshBtn = document.getElementById('refreshBtn');
        const chatContainer = document.getElementById('chatContainer');

        // State
        let allFilesData = {}; // filename -> [conversations]
        let currentConv = null;
        let currentView = 'current';

        // Drag & Drop Handlers
        dropZone.addEventListener('click', () => fileInput.click());

        refreshBtn.addEventListener('click', () => {
            fetchDatasets();
        });

        datasetSelector.addEventListener('change', (e) => {
            const path = e.target.value;
            if (path) {
                fetchDatasetContent(path);
            }
        });

        // Initialize when window loads
        window.onload = function () {
            fetchDatasets();
        };

        function fetchDatasets() {
            datasetSelector.innerHTML = '<option value="">Loading datasets...</option>';
            fetch('/api/datasets')
                .then(response => response.json())
                .then(datasets => {
                    datasetSelector.innerHTML = '<option value="">-- Select a dataset --</option>';
                    if (datasets.length === 0) {
                        datasetSelector.innerHTML = '<option value="">No datasets found</option>';
                        return;
                    }

                    datasets.forEach(ds => {
                        const option = document.createElement('option');
                        option.value = ds.path;
                        option.textContent = (ds.priority ? '⭐ ' : '') + ds.name;
                        datasetSelector.appendChild(option);
                    });

                    // Auto-load the first priority dataset if available
                    const firstPriority = datasets.find(d => d.priority);
                    if (firstPriority) {
                        datasetSelector.value = firstPriority.path;
                        fetchDatasetContent(firstPriority.path);
                    }
                })
                .catch(err => {
                    console.error("Failed to fetch datasets:", err);
                    datasetSelector.innerHTML = '<option value="">Error loading datasets</option>';
                    // Fallback to manual if API fails
                    document.querySelector('.empty-state p').innerHTML = `
                        Run <code>py tools/run_visualizer.py</code> for dynamic loading.<br>
                        Or drop files into the zone below.
                    `;
                });
        }

        function fetchDatasetContent(path) {
            console.log("Fetching dataset content from:", path);
            const timestamp = new Date().getTime();
            fetch(`/api/data/${path}?t=${timestamp}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(text => {
                    const conversations = parseJSONL(text);
                    if (conversations.length > 0) {
                        // We use the full path as key to avoid name collisions
                        allFilesData = {}; // Clear previous if we only want one at a time, or keep if we want to merge
                        allFilesData[path] = conversations;
                        renderSidebar();
                    } else {
                        console.warn("No conversations found in fetched file.");
                    }
                })
                .catch(e => {
                    console.error("Failed to fetch dataset content:", e);
                    alert("Could not load dataset: " + e.message);
                });
        }

        function handleFiles(fileList) {
            Array.from(fileList).forEach(file => {
                if (file.name.endsWith('.jsonl') || file.name.endsWith('.json')) {
                    readFile(file);
                }
            });
        }

        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const conversations = parseJSONL(text);
                if (conversations.length > 0) {
                    allFilesData[file.name] = conversations;
                    renderSidebar();
                }
            };
            reader.readAsText(file);
        }

        function parseJSONL(text) {
            const lines = text.trim().split('\n');
            const parsed = [];
            lines.forEach((line, index) => {
                try {
                    if (!line.trim()) return;
                    const cleanLine = line.replace(/^\d+:\s*/, '');
                    parsed.push(JSON.parse(cleanLine));
                } catch (e) {
                    console.error(`Error parsing line ${index}:`, e);
                }
            });
            return parsed;
        }

        function renderSidebar() {
            conversationList.innerHTML = '';

            Object.keys(allFilesData).sort().forEach(filename => {
                const fileGroup = document.createElement('div');
                fileGroup.className = 'file-group';

                const header = document.createElement('div');
                header.className = 'file-header';
                header.innerHTML = `<span>${filename}</span> <span>${allFilesData[filename].length}</span>`;

                // Toggle visibility logic could go here

                fileGroup.appendChild(header);

                allFilesData[filename].forEach((conv, index) => {
                    const el = document.createElement('div');
                    el.className = 'conversation-item';

                    const meta = conv._meta || {};
                    const scenario = meta.scenario || filename.replace('.jsonl', '');
                    const runId = meta.run_id !== undefined ? `Run #${meta.run_id}` : `ID #${index}`;

                    el.innerHTML = `
                        <div class="item-row">
                            <span class="item-scenario">${scenario}</span>
                            <span class="badge" style="font-size:0.6rem;">${conv.messages.length} msgs</span>
                        </div>
                        <div class="item-id">${runId}</div>
                    `;

                    el.addEventListener('click', () => {
                        // clear active class from all
                        document.querySelectorAll('.conversation-item').forEach(i => i.classList.remove('active'));
                        el.classList.add('active');
                        currentConv = conv;
                        renderCurrentSelection();
                        renderMetadata(conv);
                    });
                    fileGroup.appendChild(el);
                });

                conversationList.appendChild(fileGroup);
            });
        }

        function switchView(view) {
            currentView = view;

            // Update UI buttons
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.classList.toggle('active',
                    (view === 'current' && btn.textContent.includes('current')) ||
                    (view === 'last_user' && btn.textContent.includes('context in last user')) ||
                    (view === 'all_user' && btn.textContent.includes('context in all user'))
                );
            });

            renderCurrentSelection();
        }

        function renderCurrentSelection() {
            if (!currentConv) return;

            const reformatted = reformatConversation(currentConv, currentView);
            renderChat(reformatted);
        }

        function reformatConversation(conv, strategy) {
            if (strategy === 'current') return conv;

            const newMessages = [];
            let pendingContext = "";

            // Strategy: context in ALL user
            if (strategy === 'all_user') {
                conv.messages.forEach((msg, idx) => {
                    // Always preserve initial system prompt
                    if (idx === 0 && msg.role === 'system') {
                        newMessages.push(msg);
                        return;
                    }

                    if (msg.role === 'system' && msg.content && (msg.content.includes('<ctx') || msg.content.includes('<context'))) {
                        pendingContext += msg.content + "\n\n";
                    } else if (msg.role === 'user') {
                        newMessages.push({
                            ...msg,
                            injected_context: pendingContext || null
                        });
                        pendingContext = "";
                    } else {
                        newMessages.push(msg);
                    }
                });
                return { ...conv, messages: newMessages };
            }

            // Strategy: context in LAST user
            if (strategy === 'last_user') {
                let lastContext = "";
                let lastUserIndex = -1;

                // Find last user index and last context content
                conv.messages.forEach((msg, idx) => {
                    if (msg.role === 'system' && idx > 0 && msg.content && (msg.content.includes('<ctx') || msg.content.includes('<context'))) {
                        lastContext = msg.content; // Keep overwriting to get the last one
                    } else if (msg.role === 'user') {
                        lastUserIndex = idx;
                    }
                });

                if (lastUserIndex === -1) return conv;

                conv.messages.forEach((msg, idx) => {
                    // Always preserve initial system prompt
                    if (idx === 0 && msg.role === 'system') {
                        newMessages.push(msg);
                        return;
                    }

                    // Skip other system messages (intermediate context updates)
                    if (msg.role === 'system' && idx > 0) {
                        return;
                    }

                    if (idx === lastUserIndex) {
                        newMessages.push({
                            ...msg,
                            injected_context: lastContext || null
                        });
                    } else {
                        newMessages.push(msg);
                    }
                });
                return { ...conv, messages: newMessages };
            }

            // Strategy: tool -> user
            if (strategy === 'tool_to_user') {
                conv.messages.forEach(msg => {
                    newMessages.push({
                        ...msg,
                        role: msg.role === 'tool' ? 'user' : msg.role
                    });
                });
                return { ...conv, messages: newMessages };
            }

            return conv;
        }

        function renderChat(conv) {
            chatContainer.innerHTML = '';

            conv.messages.forEach(msg => {
                const wrapper = document.createElement('div');
                wrapper.className = `message ${msg.role}`;

                let header = `<div class="message-header">${msg.role}</div>`;
                if (msg.role === 'system') {
                    header = `<div class="message-header">🖥️ SYSTEM PROMPT</div>`;
                }

                let content = '';

                // Render injected context if present
                if (msg.injected_context) {
                    content += `
                        <div class="context-box">
                            <div class="context-box-title">Injected Context</div>
                            <div class="context-content">${escapeHtml(msg.injected_context.trim())}</div>
                        </div>
                    `;
                }

                // Handle text content
                if (msg.content) {
                    if (typeof msg.content === 'string' && (msg.content.startsWith('{') || msg.content.startsWith('['))) {
                        try {
                            const pretty = JSON.stringify(JSON.parse(msg.content), null, 2);
                            content += `<div class="json-block">${escapeHtml(pretty)}</div>`;
                        } catch {
                            content += `<div class="message-content">${escapeHtml(msg.content)}</div>`;
                        }
                    } else {
                        content += `<div class="message-content">${escapeHtml(msg.content)}</div>`;
                    }
                }

                // Handle Tool Calls
                if (msg.tool_calls) {
                    content += msg.tool_calls.map(call => {
                        return `
                            <div class="function-call">
                                <div style="color: #c4b5fd; margin-bottom: 0.25rem;">🛠️ ${escapeHtml(call.function.name)}</div>
                                <div style="color: #a78bfa;">${escapeHtml(call.function.arguments)}</div>
                            </div>
                        `;
                    }).join('');
                }

                wrapper.innerHTML = header + content;
                chatContainer.appendChild(wrapper);
            });
        }

        function renderMetadata(conv) {
            metadataPanel.style.display = 'block';

            const { _meta, ...rest } = conv;
            const { contexts, ...metaRest } = _meta || {};

            metaContent.textContent = _meta ? JSON.stringify(metaRest, null, 2) : "No metadata";
            contextContent.textContent = contexts ? JSON.stringify(contexts, null, 2) : "No context data";
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>
